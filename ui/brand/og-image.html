<!doctype html>
<!-- OGP 画像（1200×630）の型。build.ts が下の2つの印に、アイコンと名前を差し込んでから Chrome で描画する -->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&display=block"
    />
    <style>
      /* 色は画面（src/styles/global.css）のライトモードの値に合わせる */
      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        gap: 64px;
        padding: 0 88px;
        box-sizing: border-box;
        background: #ffffff;
        color: #17191c;
        font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
      }

      .icon {
        flex: none;
        width: 300px;
        height: 300px;
      }

      .icon svg {
        width: 100%;
        height: 100%;
      }

      .name {
        /* 「知りたいことから探す」の10文字で折り返し、名前を2行で見せる */
        max-width: 10.5em;
        margin: 0 0 40px;
        font-size: 64px;
        font-weight: 700;
        line-height: 1.35;
        letter-spacing: 0.04em;
      }

      /* ホームの検索欄と同じく、「探しているのは、」に続く下線の空欄に例が書き込まれている形 */
      .query {
        display: flex;
        align-items: baseline;
        gap: 14px;
        font-size: 30px;
        font-weight: 500;
        letter-spacing: 0.06em;
        white-space: nowrap;
      }

      .blank {
        padding: 0 4px 6px;
        border-bottom: 3px solid #17191c;
        color: #6b7078;
      }
    </style>
  </head>
  <body>
    <div class="icon">{{ICON}}</div>
    <div>
      <p class="name">{{BRAND_NAME}}</p>
      <p class="query">探しているのは、<span class="blank">いまの自分にちょうどいい本</span></p>
    </div>
  </body>
</html>
